name: Deploy

on:
  push:
    branches: [ master ]

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Check for .env and .venv in repo
      run: |
        FOUND_ENV=$(find . -name '.env' -not -path './.git/*' | head -20)
        FOUND_VENV=$(find . -name '.venv' -not -path './.git/*' -type d | head -20)
        
        if [ -n "$FOUND_ENV" ]; then
          echo "❌ .env file(s) found in repo:"
          echo "$FOUND_ENV"
          exit 1
        fi
        
        if [ -n "$FOUND_VENV" ]; then
          echo "❌ .venv directory found in repo:"
          echo "$FOUND_VENV"
          exit 1
        fi
        
        echo "✅ No .env or .venv found"

    - name: Build Docker images
      run: |
        docker compose build --no-cache
        echo "✅ Build succeeded"

    - name: Check Python dependencies
      run: |
        docker compose run --rm --no-deps -T web pip check
        echo "✅ Dependencies check out"

  deploy:
    name: Deploy to Servers
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Server 1
      env:
        SSH_PRIVATE_KEY_BASE64: ${{ secrets.SOLARA_BASE64 }}
        SERVER_IP: ${{ secrets.SERVER_IP_1 }}
      run: |
        echo "$SSH_PRIVATE_KEY_BASE64" > SOLARA
        chmod 600 SOLARA
        
        echo "Deploying to Server 1 ($SERVER_IP)..."
        
        for i in {1..10}; do
          if ssh -i SOLARA -o StrictHostKeyChecking=no -o ConnectTimeout=5 ubuntu@$SERVER_IP "echo ready" 2>/dev/null; then
            break
          fi
          echo "Waiting for server... ($i/10)"
          sleep 10
        done
        
        rsync -avz --delete \
          -e "ssh -i SOLARA -o StrictHostKeyChecking=no" \
          --exclude '.git' \
          --exclude '.github' \
          --exclude 'terraform' \
          --exclude '*.pyc' \
          --exclude '__pycache__' \
          --exclude '.env' \
          --exclude 'staticfiles' \
          --exclude 'media' \
          --exclude '.venv' \
          --exclude 'k8s' \
          . ubuntu@$SERVER_IP:/home/ubuntu/solaradocs/
        
        ssh -i SOLARA -o StrictHostKeyChecking=no ubuntu@$SERVER_IP << 'ENDSSH'
        cd /home/ubuntu/solaradocs
        docker-compose down || true
        docker-compose up -d --build
        docker ps
        ENDSSH
        
        echo "✅ Server 1 deployed"