name: Deploy (v2 sol-ctl)

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: "Server to deploy to (1 = primary)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check no .env in repo
        run: |
          FOUND=$(find . -name '.env' -not -path './.git/*' | head -5)
          if [ -n "$FOUND" ]; then
            echo "❌ .env found in repo: $FOUND"; exit 1
          fi
          echo "✅ no .env in repo"

      - name: Check manifests exist
        run: |
          test -f manifests/vpc.yaml || { echo "❌ manifests/vpc.yaml missing"; exit 1; }
          test -f manifests/services.yaml || { echo "❌ manifests/services.yaml missing"; exit 1; }
          test -f deploy/v2/deploy.sh || { echo "❌ deploy/v2/deploy.sh missing"; exit 1; }
          echo "✅ manifests present"

      - name: Validate manifest YAML syntax (lightweight)
        run: |
          python3 -c "
          import yaml, sys
          for f in ['manifests/vpc.yaml', 'manifests/services.yaml']:
              raw = list(yaml.safe_load_all(open(f)))
              # Skip empty docs (stray '---' separators between blocks are
              # legal YAML but parse as None). Server-side 'solctl-v2
              # validate -f' is the real schema gate; this is just a syntax
              # smoke that the YAML itself parses.
              docs = [d for d in raw if d is not None]
              print(f'{f}: {len(docs)} non-empty document(s) ({len(raw)} total incl. empty)')
              for i, d in enumerate(docs):
                  if not isinstance(d, dict):
                      sys.exit(f'doc #{i} in {f} is not a mapping: {type(d).__name__}')
                  if 'apiVersion' not in d or 'kind' not in d:
                      sys.exit(f'doc #{i} in {f} missing apiVersion/kind: {d}')
          "

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v3

      - name: Set target server IP
        id: target
        run: |
          echo "ip=${{ secrets.SERVER_IP_1 }}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          SSH_PRIVATE_KEY_BASE64: ${{ secrets.SOLARA_BASE64 }}
          SERVER_IP: ${{ steps.target.outputs.ip }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "$SSH_PRIVATE_KEY_BASE64" > SOLARA
          chmod 600 SOLARA

          echo "Deploying v2 to $SERVER_IP (sha=$GIT_SHA)"

          for i in {1..10}; do
            if ssh -i SOLARA -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                ubuntu@$SERVER_IP "echo ready" 2>/dev/null; then
              break
            fi
            echo "Waiting for SSH... ($i/10)"
            sleep 10
          done

          rsync -avz --delete \
            -e "ssh -i SOLARA -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'terraform' \
            --exclude '*.pyc' \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude 'staticfiles' \
            --exclude 'media' \
            --exclude '.venv' \
            --exclude 'k8s' \
            . ubuntu@$SERVER_IP:/home/ubuntu/solaradocs/

          SHORT_SHA="$(echo "$GIT_SHA" | cut -c1-7)"
          ssh -i SOLARA -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 ubuntu@$SERVER_IP \
              "sudo GIT_SHA=$SHORT_SHA bash /home/ubuntu/solaradocs/deploy/v2/deploy.sh"

          echo "✅ Deployed (v2, sha=$SHORT_SHA)"

      - name: Smoke from CI
        if: success()
        env:
          SSH_PRIVATE_KEY_BASE64: ${{ secrets.SOLARA_BASE64 }}
          SERVER_IP: ${{ steps.target.outputs.ip }}
        run: |
          echo "$SSH_PRIVATE_KEY_BASE64" > SOLARA
          chmod 600 SOLARA
          WARDENT_SECRET=$(ssh -i SOLARA -o StrictHostKeyChecking=no ubuntu@$SERVER_IP \
            "sudo grep -E '^WARDENT_SECRET=' /var/sol-ctl/soldocs/.env | cut -d= -f2- | tr -d '\"'")
          if [ -z "$WARDENT_SECRET" ]; then
            echo "⚠️  WARDENT_SECRET not in server env — skipping external smoke"
            exit 0
          fi
          CODE=$(ssh -i SOLARA -o StrictHostKeyChecking=no ubuntu@$SERVER_IP \
            "curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
             -H 'X-Wardent-Secret: $WARDENT_SECRET' \
             -H 'X-Sol-Environment: soldocs' \
             http://127.0.0.1:9040/metrics")
          if [ "$CODE" != "200" ]; then
            echo "❌ smoke: router /metrics returned $CODE"; exit 1
          fi
          echo "✅ router smoke: /metrics → 200"