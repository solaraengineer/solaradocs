name: Reset (safe flip, then nuke old)

# Manual-trigger ONLY. Deploys fresh to the TARGET vpc, waits until it's
# healthy, flips etcd active state + wardent, THEN removes containers from
# the old vpc. No downtime window where both VPCs are empty.
#
# You MUST type RESET in the confirm field. Anything else and the job
# short-circuits without touching the server.
#
# Flow:
#   1. Deploy to TARGET_VPC (build + start containers)
#   2. Wait until TARGET_VPC is healthy
#   3. Flip etcd active state + wardent to TARGET_VPC
#   4. Nuke containers from the OLD vpc
#   5. Re-arm rollback monitor
#
# After this: the old vpc is empty, the new one is serving. Next regular
# `git push master` deploys to the empty vpc as standby, restoring full
# two-vpc blue/green rotation.

on:
  workflow_dispatch:
    inputs:
      target_vpc:
        description: "VPC to deploy to (will become the active one)"
        required: true
        default: "sd-blue"
        type: choice
        options:
          - sd-blue
          - sd-green
      confirm:
        description: 'Type RESET (all caps) to confirm'
        required: true
        type: string
      skip_build:
        description: "Skip docker build+push (reuse the image already in the local registry for current HEAD)"
        required: false
        default: false
        type: boolean

jobs:
  guard:
    name: Confirm gate
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "RESET" ]; then
            echo "::error::confirm must be exactly 'RESET' (got: '${{ inputs.confirm }}'). Aborting."
            exit 1
          fi
          echo "confirmed — proceeding with safe reset to ${{ inputs.target_vpc }}"

  reset:
    name: Safe reset → ${{ inputs.target_vpc }}
    runs-on: ubuntu-latest
    needs: guard

    steps:
      - uses: actions/checkout@v3

      - name: Set target server IP
        id: target
        run: |
          echo "ip=${{ secrets.SERVER_IP_1 }}" >> "$GITHUB_OUTPUT"

      - name: Rsync + reset on server
        env:
          SSH_PRIVATE_KEY_BASE64: ${{ secrets.SOLARA_BASE64 }}
          SERVER_IP: ${{ steps.target.outputs.ip }}
          GIT_SHA: ${{ github.sha }}
          TARGET_VPC: ${{ inputs.target_vpc }}
          SKIP_BUILD: ${{ inputs.skip_build && '1' || '' }}
        run: |
          set -euo pipefail
          echo "$SSH_PRIVATE_KEY_BASE64" > SOLARA
          chmod 600 SOLARA

          echo "Safe reset $SERVER_IP → $TARGET_VPC (sha=$GIT_SHA, skip_build=${SKIP_BUILD:-0})"

          for i in {1..10}; do
            if ssh -i SOLARA -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                ubuntu@$SERVER_IP "echo ready" 2>/dev/null; then
              break
            fi
            echo "Waiting for SSH... ($i/10)"
            sleep 10
          done

          rsync -avz --delete \
            -e "ssh -i SOLARA -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'terraform' \
            --exclude '*.pyc' \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude 'staticfiles' \
            --exclude 'media' \
            --exclude '.venv' \
            --exclude 'k8s' \
            . ubuntu@$SERVER_IP:/home/ubuntu/solaradocs/

          SHORT_SHA="$(echo "$GIT_SHA" | cut -c1-7)"
          ssh -i SOLARA -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              ubuntu@$SERVER_IP \
              "sudo GIT_SHA=$SHORT_SHA TARGET_VPC=$TARGET_VPC SKIP_BUILD=${SKIP_BUILD:-} WARDENT_TOML=/etc/wardent/wardent.toml bash /home/ubuntu/solaradocs/deploy/v2/reset.sh"

          echo "safe reset complete: $TARGET_VPC is the sole active VPC (sha=$SHORT_SHA)"

      - name: External smoke
        if: success()
        env:
          SSH_PRIVATE_KEY_BASE64: ${{ secrets.SOLARA_BASE64 }}
          SERVER_IP: ${{ steps.target.outputs.ip }}
          TARGET_VPC: ${{ inputs.target_vpc }}
        run: |
          echo "$SSH_PRIVATE_KEY_BASE64" > SOLARA
          chmod 600 SOLARA
          WARDENT_SECRET=$(ssh -i SOLARA -o StrictHostKeyChecking=no ubuntu@$SERVER_IP \
            "sudo grep -E '^WARDENT_SECRET=' /var/sol-ctl/${TARGET_VPC}/.env | cut -d= -f2- | tr -d '\"'")
          if [ -z "$WARDENT_SECRET" ]; then
            echo "WARDENT_SECRET not in /var/sol-ctl/${TARGET_VPC}/.env — skipping external smoke"
            exit 0
          fi
          CODE=$(ssh -i SOLARA -o StrictHostKeyChecking=no ubuntu@$SERVER_IP \
            "curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
             -H 'X-Wardent-Secret: $WARDENT_SECRET' \
             -H 'X-Sol-Environment: $TARGET_VPC' \
             http://127.0.0.1:9040/metrics")
          if [ "$CODE" != "200" ]; then
            echo "::error::router /metrics returned $CODE (expected 200) — reset landed but stack isn't serving"
            exit 1
          fi
          echo "router smoke: /metrics → 200 (sole active = $TARGET_VPC)"