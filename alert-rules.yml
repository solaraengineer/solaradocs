groups:
  - name: node_resources
    rules:
      - alert: DiskUsageHigh
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 80
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage above 80%: {{ $value | printf \"%.1f\" }}%"

      - alert: CPUUsageHigh
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 75
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage above 75%: {{ $value | printf \"%.1f\" }}%"

      - alert: RAMUsageHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 80
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "RAM usage above 80%: {{ $value | printf \"%.1f\" }}%"

  - name: container_health
    rules:
      - alert: ContainerDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is DOWN"

  - name: django_errors
    rules:
      - alert: HighErrorRate
        expr: increase(django_http_responses_total_by_status_total{status=~"5.."}[5m]) >= 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "2+ 500 errors in last 5 minutes: {{ $value }} total"

      - alert: SuspiciousAuthFailures
        expr: increase(django_http_responses_total_by_status_total{status=~"401|403"}[5m]) >= 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "2+ unauthorized access attempts in 5min: {{ $value }} total ({{ $labels.status }})"
  - name: traffic_anomaly
    rules:
      - alert: TrafficSpike
        expr: rate(django_http_requests_before_middlewares_total[5m]) > 50
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Request rate above 50/s sustained for 2min: {{ $value | printf \"%.1f\" }} req/s"

  - name: log_silence
    rules:
      - alert: NoNewLogs
        expr: time() - max(timestamp(django_http_requests_total_by_method_total)) > 600
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "No new requests for 10+ minutes — service may be dead"

  - name: trace_latency
    rules:
      - alert: CheckoutSessionSlow
        expr: histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{span_name="/create-checkout-session/"}[5m])) by (le)) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "create-checkout-session p95 latency above 10s: {{ $value | printf \"%.1f\" }}s"

      - alert: EndpointLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(traces_spanmetrics_latency_bucket{
              span_name!~"/create-checkout-session/|/webhook/stripe/"
            }[5m])) by (le, span_name)
          ) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.span_name }} p95 latency above 3s: {{ $value | printf \"%.1f\" }}s"

  - name: redis_health
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN — Celery and caching broken"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes > 200000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory above 200MB: {{ $value | humanize }}B"

  - name: celery_health
    rules:
      - alert: CeleryWorkerDown
        expr: celery_workers_active == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No active Celery workers — async tasks halted"