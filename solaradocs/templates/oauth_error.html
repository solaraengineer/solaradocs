<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization error — SolaraDocs</title>
<style>
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #f3f3f3;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        background: #1a1a1a;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 32px;
        max-width: 480px;
    }
    h1 { color: #d9544a; margin: 0 0 12px; font-size: 1.3rem; }
    .code {
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
        color: #a0a0a0;
        margin-bottom: 16px;
    }
    p { color: #c0c0c0; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
    <h1>Authorization error</h1>
    <div class="code">{{ error }}</div>
    <p>{{ description }}</p>
</div>
</body>
</html>
