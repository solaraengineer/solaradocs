<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #1a1915; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #1a1915; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table width="480" cellpadding="0" cellspacing="0" style="max-width: 480px; width: 100%;">
                    <!-- Logo -->
                    <tr>
                        <td align="center" style="padding-bottom: 32px;">
                            <table cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="width: 36px; height: 36px; background: linear-gradient(135deg, #d4a574, #9d7cd8); border-radius: 8px; text-align: center; vertical-align: middle; font-family: 'Courier New', monospace; font-weight: 700; font-size: 16px; color: #1a1915;">
                                        S
                                    </td>
                                    <td style="padding-left: 10px; font-size: 16px; font-weight: 600; color: #e8e4dd;">
                                        Solara Docs
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Card -->
                    <tr>
                        <td style="background-color: #21201c; border: 1px solid #2e2d28; border-radius: 12px; padding: 36px 32px;">
                            <!-- Heading -->
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="font-size: 20px; font-weight: 700; color: #e8e4dd; padding-bottom: 8px;">
                                        Password reset
                                    </td>
                                </tr>
                                <tr>
                                    <td style="font-size: 14px; color: #a8a59e; padding-bottom: 28px; line-height: 1.5;">
                                        Hey {{ username }}, here's your 6-digit code. It expires in 15 minutes.
                                    </td>
                                </tr>
                            </table>

                            <!-- Code -->
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center" style="padding-bottom: 28px;">
                                        <table cellpadding="0" cellspacing="0" style="background-color: #1a1915; border: 1px solid #3d3b35; border-radius: 8px; padding: 16px 32px;">
                                            <tr>
                                                <td style="font-family: 'Courier New', monospace; font-size: 32px; font-weight: 700; color: #d4a574; letter-spacing: 8px; text-align: center;">
                                                    {{ code }}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <!-- Warning -->
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="background-color: rgba(212, 165, 116, 0.08); border: 1px solid rgba(212, 165, 116, 0.15); border-radius: 8px; padding: 12px 16px;">
                                        <table cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td style="font-size: 13px; color: #a8a59e; line-height: 1.5;">
                                                    If you didn't request this, ignore this email. Your password won't change.
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding-top: 24px;">
                            <table cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="font-size: 12px; color: #6b6963; text-align: center; line-height: 1.5;">
                                        Solara Docs &mdash; solaradocs.net
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
