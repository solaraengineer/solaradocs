<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upgrade required — SolaraDocs</title>
<style>
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #f3f3f3;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        background: #1a1a1a;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 32px;
        max-width: 480px;
    }
    h1 { margin: 0 0 12px; font-size: 1.35rem; font-weight: 600; }
    p { color: #c0c0c0; line-height: 1.55; margin: 0 0 16px; }
    .lead strong { color: #f3f3f3; }
    .actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        font-size: 0.95rem;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
    }
    .btn-primary { background: #e8a048; color: #1a0f00; font-weight: 500; }
    .btn-secondary { background: transparent; color: #f3f3f3; border: 1px solid rgba(255,255,255,0.1); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary:hover { background: rgba(255,255,255,0.04); }
</style>
</head>
<body>
<div class="card">
    <h1>Upgrade required</h1>
    <p class="lead">
        <strong>{{ client_name }}</strong> wants to connect to your SolaraDocs account.
        Connecting external apps (Claude, scripts, integrations) is included on the
        Personal plan and above.
    </p>
    <p>
        Your account is on the Free plan. Upgrade to Personal to connect this and other apps.
    </p>
    <div class="actions">
        <a href="/buy/" class="btn btn-primary">View plans</a>
        <a href="/profile/" class="btn btn-secondary">Back to profile</a>
    </div>
</div>
</body>
</html>
