global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.sendgrid.net:587'
  smtp_from: 'support@solaradocs.net'
  smtp_auth_username: 'apikey'
  smtp_auth_password: '{SENDGRID_API_KEY}'
  smtp_require_tls: true

route:
  receiver: 'email-critical'
  group_by: ['alertname', 'severity']
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'email-critical'
      group_wait: 10s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'email-warning'
      group_wait: 30s
      repeat_interval: 4h
    - match:
        severity: info
      receiver: 'email-info'
      repeat_interval: 12h

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

receivers:
  - name: 'email-critical'
    email_configs:
      - to: 'solaradeveloper@gmail.com'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
  - name: 'email-warning'
    email_configs:
      - to: 'solaradeveloper@gmail.com'
        send_resolved: true
        headers:
          Subject: '[WARNING] {{ .GroupLabels.alertname }}'
  - name: 'email-info'
    email_configs:
      - to: 'solaradeveloper@gmail.com'
        send_resolved: true
        headers:
          Subject: '[INFO] {{ .GroupLabels.alertname }}'