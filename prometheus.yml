global:
  scrape_interval: 45s
  evaluation_interval: 45s
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
rule_files:
  - /etc/prometheus/alert-rules.yml
storage:
  tsdb:
    out_of_order_time_window: 30m
scrape_configs:
  - job_name: 'sol-ctl'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets.json'
        refresh_interval: 10s